<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futebolland</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
    <div id="placar">
        <span id="casa">Casa</span>
        <span id="resultado">0 x 0</span>
        <span id="visitante">Visitante</span>
    </div>
    <div id="tempo">
        1º Tempo - 00:00
    </div>
</div>

<canvas id="game"></canvas>

<div id="controles">
    <div id="joystick">
        <div id="stick"></div>
    </div>
    <div id="acoes">
        <button id="passe">Passe</button>
        <button id="chute">Chute</button>
        <button id="drible">Drible</button>
        <button id="carrinho">Carrinho</button>
        <button id="trocar">Trocar</button>
        <button id="pausar">Pausa</button>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
